[package]
name = "milkrice-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream", "json"] }
hound = "3"
which = "8"
rrule = "0.14"
sha2 = "0.10"
chrono-tz = "0.10"
transcribe-rs = { version = "0.3.12", features = ["onnx", "whisper-metal"] }
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17"
rustfft = "6"
cpal = "0.16"
rubato = "0.16"
aec3 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDate", "NSError", "NSURL", "NSRunLoop", "NSDictionary", "NSValue", "NSUUID", "block2"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKParticipant", "EKCalendar", "EKObject", "EKTypes", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSColor", "NSColorSpace"] }
objc2-core-audio = "0.3"
block2 = "0.6"

[[bin]]
name = "milkrice-cli"
path = "src/bin/milkrice-cli.rs"
